name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  projects-matrix:
    name: Detect changed projects
    runs-on: ubuntu-latest
    concurrency:
      group: matrix-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      projects: ${{ steps.filter-projects.outputs.projects }}
    env:
      # "node" covers every npm workspace (backend, ui, packages/*, apps/*/*): they share one
      # lockfile and shared packages affect every consumer, so they are checked together.
      all_projects: "node ai-agent"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed top-level projects (PRs only)
        if: github.event_name == 'pull_request'
        id: get-changes
        run: |
          git fetch origin main
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD | cut -d/ -f1 | sort -u | tr "\n" " ")
          echo "Changed projects: $CHANGED_FILES"
          echo "changed_files=$CHANGED_FILES" >> "$GITHUB_OUTPUT"

      - name: Filter projects based on changes
        id: filter-projects
        run: |
          ALL_PROJECTS=($all_projects)
          CHANGED_FILES="${{ steps.get-changes.outputs.changed_files }}"
          FILTERED=()
          if echo "$CHANGED_FILES" | grep -qwE "backend|ui|packages|apps|package.json|package-lock.json"; then
            FILTERED+=("node")
          fi
          if echo "$CHANGED_FILES" | grep -qw "ai-agent"; then
            FILTERED+=("ai-agent")
          fi
          # No project-specific changes detected (push to main, or a PR that only
          # touched root-level files) -> run the full matrix.
          if [ ${#FILTERED[@]} -eq 0 ]; then
            FILTERED=(${ALL_PROJECTS[@]})
          fi
          JSON=$(printf '%s\n' "${FILTERED[@]}" | jq -R . | jq -s -c .)
          echo "Running matrix for: $JSON"
          echo "projects=$JSON" >> "$GITHUB_OUTPUT"

  check:
    name: Check (${{ matrix.project }})
    needs: projects-matrix
    runs-on: ubuntu-latest
    concurrency:
      group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.project }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.projects-matrix.outputs.projects) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        if: matrix.project == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Set up Python
        if: matrix.project == 'ai-agent'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ai-agent/requirements.txt

      - name: Install dependencies (Node)
        if: matrix.project == 'node'
        run: npm ci

      - name: Install dependencies (Python)
        if: matrix.project == 'ai-agent'
        run: |
          cd ai-agent
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Typecheck
        if: matrix.project == 'node'
        run: npm run typecheck

      - name: Lint
        if: matrix.project == 'node'
        run: npm run lint

      - name: Python syntax / import check
        if: matrix.project == 'ai-agent'
        run: |
          cd ai-agent
          python -m compileall -q app
          python -c "import app.main"

      - name: Build
        if: matrix.project == 'node'
        run: npm run build

      - name: Test
        if: matrix.project == 'node'
        run: npm test
        # Runs `test` in every workspace that defines it (backend today).
        # ai-agent has no test suite yet.

  tests-passed:
    name: Tests passed
    runs-on: ubuntu-latest
    needs: [check]
    if: always()
    steps:
      - name: Check matrix result
        run: |
          result="${{ needs.check.result }}"
          if [[ "$result" == "success" ]]; then
            exit 0
          else
            echo "One or more matrix legs failed: $result"
            exit 1
          fi
