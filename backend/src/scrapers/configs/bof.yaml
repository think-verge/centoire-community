name: "Business of Fashion"
domain: "businessoffashion.com"
is_paid: true
engine: "playwright"

auth:
  type: "credentials"
  env_user_key: "BOF_EMAIL"
  env_pass_key: "BOF_PASSWORD"
  login_url: "https://www.businessoffashion.com/login"
  username_selector: "input[type='email'], input[name='email']"
  password_selector: "input[type='password'], input[name='password']"
  submit_selector: "button[type='submit']"
  wait_for_selector: "div[class*='article-body'], script#fusion-metadata"

attribution:
  canonical: true
  show_read_original_link: true

selectors:
  title: "h1, .article-headline"
  author: "span[class*='author'], div[class*='byline'], a[class*='author']"
  lead_image: "figure img, div[class*='hero'] img, .lead-image img"
  body: "div[class*='article-body'], div[class*='content-body'], div[class*='paywalled-content'], article"
  remove:
    - "figure[class*='lead']"
    - "div[class*='lead-image']"
    - "div[class*='paywall']"
    - "div[class*='newsletter']"
    - "div[class*='ad-container']"
    - "div[class*='advertisement']"
    - "div[class*='social-share']"
    - "div[class*='related']"
    - "div[class*='recirc']"
    - ".share-tools"
    - ".article-tags"
