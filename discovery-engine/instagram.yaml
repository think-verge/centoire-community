# Instagram watchlist — streetwear & sneakers seed list.
#
# NOT YET VERIFIED. Handles are from general knowledge plus two leakers credited in
# blog articles we sampled (lovedrose16, zsneakerheadz). Run
#   python -m scripts.instagram_setup --check-watchlist
# once Instagram is connected: it reports handles that don't exist or aren't
# Business/Creator accounts (the API can only read those). Fix or remove them.
#
#   role    insider      — leakers and insiders: the layer measured as AHEAD of the blogs
#           brand        — brand accounts: usually level with the blogs (embargoes)
#           collaborator — artists/athletes/designers who tease collabs themselves
#           retailer     — shops; sometimes post samples or early pairs
#   tier    fast = every 10 min (6 calls/h), normal = 30 min (2/h), slow = 60 min (1/h)
#
# Budget: 15 fast (90/h) + 25 normal (50/h) + 20 slow (20/h) = 160 calls/hour,
# under the 180/hour planning budget (IG_MAX_CALLS_PER_HOUR). Check GET /instagram.

accounts:
