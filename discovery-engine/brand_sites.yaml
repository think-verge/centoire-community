# Brand websites — the brand's own channels, not its shop catalogue.
#
# Every URL was checked live on 2026-11-06 with the engine's user agent.
#
#   type sitemap  a brand sitemap; every URL never listed before becomes an item
#                 (Nike's SNKRS sitemap gains a URL when a launch page is published)
#   type page     a newsroom / press page; every new link matching include_url is an item
#   type rss      brand blogs that already publish a feed (Shopify .atom)
#   include_url   regexes; only matching URLs are watched
#   enrich        open each new page for its real title/image/date (false where pages
#                 block us or the URL slug already says it all)
#   interval      seconds, overriding the tier; the Nike sitemaps are 1–12 MB and Nike
#                 ignores conditional requests, so they are fetched in full every time.
#                 Nike regenerates them about once a day (~13:00 UTC; seen 2026-11-07), so
#                 hourly is enough. Measured: a new SNKRS page lands hours to a day AFTER the
#                 sneaker blogs; it confirms a launch, it doesn't break it.
#
# Checked and not watchable without a browser (blocked or rendered by script):
# adidas.com / news.adidas.com, New Balance, Vans, Converse, HOKA, Crocs, Puma newsroom,
# Palace, adidas Group press (times out for our user agent). Follow these on Instagram.
# Checked 2026-11-09, no usable feed: Palace, Sp5der, Hellstar, Cactus Plant Flea Market,
# Fear of God (empty blog), Nocta, Aries, Represent/Awake NY/Dime/Reebok (blogs stale for
# months), Carhartt WIP, Stone Island, Human Made, Kapital, atmos, Ader Error (blocked),
# thisisneverthat, Wooyoungmi, Andersson Bell, Visvim, Undercover, Our Legacy, Acronym.

sources:
  # ---------- Nike / Jordan / SB: SNKRS launch pages, per market ----------
  # A launch only on JP / KR / IN SNKRS is a regional exclusive: that's the geography signal.
  - {id: nike-snkrs-us, name: Nike SNKRS US, type: sitemap, region: US, role: brand, interval: 3600, enrich: false,
     url: "https://www.nike.com/sitemap-v2-snkrsweb-en-us.xml", include_url: ['/launch/t/'], exclude_title: ['\btest\b']}
  - {id: nike-snkrs-jp, name: Nike SNKRS JP, type: sitemap, region: JP, role: brand, interval: 3600, enrich: false,
     url: "https://www.nike.com/sitemap-v2-snkrsweb-ja-jp.xml", include_url: ['/launch/t/'], exclude_title: ['\btest\b']}
  - {id: nike-snkrs-gb, name: Nike SNKRS GB, type: sitemap, region: GB, role: brand, interval: 3600, enrich: false,
     url: "https://www.nike.com/sitemap-v2-snkrsweb-en-gb.xml", include_url: ['/launch/t/'], exclude_title: ['\btest\b']}
  - {id: nike-snkrs-kr, name: Nike SNKRS KR, type: sitemap, region: KR, role: brand, interval: 3600, enrich: false,
     url: "https://www.nike.com/sitemap-v2-snkrsweb-ko-kr.xml", include_url: ['/launch/t/'], exclude_title: ['\btest\b']}
  - {id: nike-snkrs-in, name: Nike SNKRS IN, type: sitemap, region: IN, role: brand, interval: 3600, enrich: false,
     url: "https://www.nike.com/sitemap-v2-snkrsweb-en-in.xml", include_url: ['/launch/t/'], exclude_title: ['\btest\b']}
  # Campaign and collection landing pages (new collabs often get one before launch).
  - {id: nike-landing-us, name: Nike landing pages, type: sitemap, region: US, role: brand, interval: 3600, enrich: false,
     url: "https://www.nike.com/sitemap-v2-landingpage-en-us.xml"}
  - {id: nike-newsroom, name: Nike Newsroom, type: page, region: GLOBAL, role: brand, tier: normal,
     url: "https://about.nike.com/en/newsroom", include_url: ['/en/newsroom/[a-z-]+/[^/]+$']}

  # ---------- Supreme: season previews and news posts ----------
  # A new /previews/<season> appears when the season preview goes live; /news/<id> are
  # collaboration announcements (usually the Monday before a Thursday drop).
  - {id: supreme-site, name: Supreme, type: sitemap, region: US, role: brand, tier: normal,
     url: "https://supreme.com/sitemap.xml", include_url: ['/previews/', '/news/\d+']}

  # ---------- other newsrooms ----------
  - {id: asics-press, name: ASICS Press, type: page, region: JP, role: brand, tier: slow,
     url: "https://corp.asics.com/en/press", include_url: ['/en/press/article/']}

  # ---------- brand blogs with feeds ----------
